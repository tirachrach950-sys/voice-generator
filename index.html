
<!DOCTYPE html>
<html lang="ar-MA" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصوت المغربي 🇲🇦</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: grid;
  place-items: center;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg,#071d19,#123c35,#152447);
  color: #fff;
}

.app {
  width: 100%;
  max-width: 620px;
  padding: 25px;
  border-radius: 22px;
  background: #ffffff0d;
  border: 1px solid #ffffff25;
  box-shadow: 0 18px 55px #0005;
}

header { text-align: center; }
.flag { font-size: 42px; }
h1 { margin: 10px 0; }
h1 span { color: #4de0ad; }

p { color: #c5d7d2; line-height: 1.8; }

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

textarea, select {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #3c615b;
  background: #0d2626;
  color: white;
  font: inherit;
}

textarea {
  min-height: 145px;
  line-height: 2;
  resize: vertical;
}

select { direction: rtl; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.panel {
  margin-top: 15px;
  padding: 13px;
  background: #0d2626;
  border-radius: 12px;
}

input[type=range] {
  width: 100%;
  accent-color: #4de0ad;
}

button {
  padding: 13px;
  border: 0;
  border-radius: 11px;
  cursor: pointer;
  font: inherit;
  font-weight: bold;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.primary { background: #4de0ad; color: #08271f; }
.secondary { background: #244740; color: white; }
.stop { background: #633546; color: white; }

#status {
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  background: #0d2626;
  color: #a9e7d4;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.small { font-size: 12px; color: #b4c9c4; }

@media(max-width:420px) {
  .grid { grid-template-columns: 1fr; }
  .app { padding: 18px; }
}
</style>
</head>

<body>
<main class="app">
  <header>
    <div class="flag">🇲🇦 🎙️</div>
    <h1>بوت الصوت <span>المغربي</span></h1>
    <p>كتب بالدارجة المغربية وسمع النص بالصوت.</p>
  </header>

  <label for="text">النص ديالك بالدارجة</label>
  <textarea id="text" placeholder="السلام عليكم، كيداير؟ لاباس عليك؟ مرحبا بيك فالمغرب..." ></textarea>

  <label for="voice">اختار صوت عربي</label>
  <select id="voice">
    <option value="">كنقلبو على الأصوات...</option>
  </select>
  <p class="small">كنفضلو العربية المغربية إلا كانت مدعومة، ومن بعد الأصوات العربية الأخرى.</p>

  <div class="grid">
    <div class="panel">
      <label for="speed">سرعة الهضرة</label>
      <input id="speed" type="range" min="0.6" max="1.3" value="0.85" step="0.05">
      <div id="speedLabel">0.85</div>
    </div>
    <div class="panel">
      <label for="pitch">نبرة الصوت</label>
      <input id="pitch" type="range" min="0.7" max="1.3" value="1" step="0.1">
      <div id="pitchLabel">1.0</div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="speak">🔊 هضر بالدارجة</button>
    <button class="secondary" id="pause">⏸ وقف مؤقتاً</button>
    <button class="secondary" id="resume">▶ كمّل</button>
    <button class="stop" id="stop">⏹ حبس الصوت</button>
    <button class="secondary" id="test">🧪 جرّب الصوت العربي</button>
    <button class="secondary" id="refresh">🔄 حدّث الأصوات</button>
  </div>

  <div id="status" role="status" aria-live="polite">
    مرحبا! اختار صوت عربي وجرّب.
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
let voices = [];
let current = null;
let run = 0;

function setStatus(message) {
  $("status").textContent = message;
}

function rankVoice(v) {
  const lang = v.lang.toLowerCase();
  const name = v.name.toLowerCase();

  // Moroccan Arabic is preferred when a voice explicitly identifies it.
  if (/^ar-ma(?:-|$)/i.test(lang)) return 100;
  if (/moroccan|darija|maghreb/i.test(name)) return 95;
  if (/^ar-dz(?:-|$)/i.test(lang)) return 80;
  if (/^ar-tn(?:-|$)/i.test(lang)) return 75;
  if (/^ar-sa(?:-|$)/i.test(lang)) return 65;
  if (/^ar(?:-|$)/i.test(lang)) return 60;
  return -1;
}

function loadVoices() {
  if (!synth) {
    setStatus("المتصفح ديالك ما كيدعمش تحويل النص لصوت.");
    $("speak").disabled = true;
    $("test").disabled = true;
    return;
  }

  voices = synth.getVoices();
  const previous = $("voice").value;

  const arabic = voices
    .map((voice, index) => ({voice, index, score: rankVoice(voice)}))
    .filter(item => item.score >= 0)
    .sort((a, b) => b.score - a.score);

  $("voice").replaceChildren();

  if (!arabic.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "ما كاين حتى صوت عربي فالجهاز";
    $("voice").appendChild(opt);
    setStatus("ما لقيناش صوت عربي مثبت. خاصك تثبت صوت العربية فإعدادات الجهاز، أو تستعمل خدمة صوت خارجية.");
    return;
  }

  arabic.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.index;
    opt.textContent = `${item.voice.name} — ${item.voice.lang}`;
    $("voice").appendChild(opt);
  });

  if (arabic.some(item => String(item.index) === previous)) {
    $("voice").value = previous;
  } else {
    $("voice").value = String(arabic[0].index);
  }

  const chosen = voices[Number($("voice").value)];
  setStatus("الصوت العربي واجد: " + chosen.name + " (" + chosen.lang + ").");
}

function stopSpeech() {
  run++;
  synth.cancel();
  current = null;
}

function speak(text) {
  if (!text.trim()) {
    setStatus("كتب شي نص بالدارجة الأول.");
    return;
  }

  const voice = voices[Number($("voice").value)];

  if (!voice || rankVoice(voice) < 0) {
    setStatus("ما كاينش صوت عربي مناسب. حدّث الأصوات أو ثبت صوت العربية فالجهاز.");
    return;
  }

  stopSpeech();
  const myRun = run;
  const utterance = new SpeechSynthesisUtterance(text);

  utterance.voice = voice;
  utterance.lang = voice.lang;
  utterance.rate = Number($("speed").value);
  utterance.pitch = Number($("pitch").value);

  utterance.onstart = () => {
    if (myRun === run) setStatus("🔊 كنهدرو دابا بالصوت: " + voice.name);
  };

  utterance.onend = () => {
    if (myRun === run) {
      current = null;
      setStatus("سالينا من قراءة النص.");
    }
  };

  utterance.onerror = e => {
    if (myRun === run) {
      current = null;
      setStatus("وقع مشكل فالصوت: " + e.error + ". جرّب صوت عربي آخر.");
    }
  };

  current = utterance;
  synth.speak(utterance);
}

$("speak").onclick = () => speak($("text").value);

$("test").onclick = () => {
  speak("السلام عليكم، كيداير؟ لاباس عليك؟ مرحبا بيك فالمغرب. كنهدرو اليوم بالدارجة المغربية.");
};

$("stop").onclick = () => {
  stopSpeech();
  setStatus("تحبس الصوت.");
};

$("pause").onclick = () => {
  if (synth.speaking && !synth.paused) {
    synth.pause();
    setStatus("الصوت توقف مؤقتاً.");
  }
};

$("resume").onclick = () => {
  if (synth.paused) {
    synth.resume();
    setStatus("رجعنا نكملو الصوت.");
  }
};

$("refresh").onclick = loadVoices;
$("speed").oninput = () => $("speedLabel").textContent = $("speed").value;
$("pitch").oninput = () => $("pitchLabel").textContent = $("pitch").value;

if (synth) {
  loadVoices();
  synth.addEventListener("voiceschanged", loadVoices);
}
</script>
</body>
</html>
