
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darija Voice Bot 🇲🇦</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial, sans-serif;
  background: #101827; color: #f8fafc;
  min-height: 100vh; display: grid; place-items: center;
  padding: 16px;
}
.app {
  width: 100%; max-width: 620px; height: min(820px, 94vh);
  min-height: 540px; display: flex; flex-direction: column;
  background: #1c2738; border: 1px solid #344256;
  border-radius: 20px; overflow: hidden;
}
header { padding: 20px; background: #087f5b; }
header h1 { margin: 0 0 7px; font-size: 23px; }
header p { margin: 0; color: #e4fff4; font-size: 14px; }
.settings { display: flex; gap: 8px; padding: 12px; }
select, button, textarea {
  font: inherit; border-radius: 10px; padding: 11px;
}
select { background: #101827; color: white; border: 1px solid #536176; }
#voice { flex: 1; min-width: 0; }
#chat {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg {
  max-width: 88%; padding: 12px 14px; border-radius: 15px;
  white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55;
}
.bot { background: #303f53; align-self: flex-start; }
.user { background: #087f5b; align-self: flex-end; }
.msg button { margin-top: 8px; padding: 6px 10px; }
.examples { padding: 0 12px 10px; display: flex; flex-wrap: wrap; gap: 7px; }
.examples button { background: #29384b; color: white; border: 1px solid #536176; }
.composer { padding: 12px; border-top: 1px solid #344256; }
textarea {
  width: 100%; resize: vertical; min-height: 55px; max-height: 140px;
  color: white; background: #101827; border: 1px solid #536176;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.actions button { flex: 1; border: 0; cursor: pointer; font-weight: bold; }
.send { background: #10b981; color: #052e22; }
.mic { background: #334155; color: white; }
.status { padding: 0 14px 10px; font-size: 12px; color: #b7c5d8; }
button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>🇲🇦 Darija Voice Bot</h1>
    <p>هضر معايا بالدارجة المغربية · Speak Moroccan Darija</p>
  </header>

  <div class="settings">
    <select id="voice" aria-label="Voice">
      <option value="">Loading voices...</option>
    </select>
    <select id="script" aria-label="Reply script">
      <option value="ar">العربية</option>
      <option value="latin">Latin Darija</option>
    </select>
  </div>

  <section id="chat" aria-live="polite">
    <div class="msg bot">السلام عليكم! أنا البوت ديالك. 😊
شنو بغيتي تعرف؟ هضر معايا بالدارجة.</div>
  </section>

  <div class="examples">
    <button data-msg="سلام، كيداير؟">Greeting</button>
    <button data-msg="شنو الطقس اليوم؟">Weather</button>
    <button data-msg="عاونّي نتعلم الإنجليزية">Learn English</button>
    <button data-msg="عطيني شي نصيحة زوينة">Advice</button>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="كتب هنا بالدارجة... / Write in Darija"></textarea>
    <div class="actions">
      <button class="mic" id="mic">🎙️ Speak</button>
      <button class="send" id="send">Send ➤</button>
    </div>
  </div>
  <div class="status" id="status">Ready · Browser voice mode</div>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat");
const input = $("input");
const status = $("status");
const voiceSelect = $("voice");

let voices = [];
let recognition = null;
let listening = false;

function loadVoices() {
  if (!("speechSynthesis" in window)) {
    voiceSelect.innerHTML = '<option>Speech not supported</option>';
    return;
  }

  voices = speechSynthesis.getVoices();
  const previous = voiceSelect.value;
  voiceSelect.innerHTML = "";

  const preferred = voices.filter(v =>
    /ar-ma/i.test(v.lang) ||
    /morocco|maroc|darija/i.test(v.name)
  );
  const arabic = voices.filter(v => /^ar([_-]|$)/i.test(v.lang));
  const others = voices.filter(v => !arabic.includes(v));

  const groups = [
    ["Moroccan Arabic — preferred", preferred],
    ["Other Arabic voices", arabic.filter(v => !preferred.includes(v))],
    ["Other installed voices", others]
  ];

  groups.forEach(([label, list]) => {
    if (!list.length) return;
    const group = document.createElement("optgroup");
    group.label = label;
    list.forEach(v => {
      const option = document.createElement("option");
      option.value = String(voices.indexOf(v));
      option.textContent = `${v.name} (${v.lang})`;
      group.appendChild(option);
    });
    voiceSelect.appendChild(group);
  });

  const exact = voices.findIndex(v => /ar-ma/i.test(v.lang));
  const fallback = voices.findIndex(v => /^ar([_-]|$)/i.test(v.lang));
  voiceSelect.value = previous || String(exact >= 0 ? exact : fallback);
  if (!voiceSelect.value && voiceSelect.options.length) {
    voiceSelect.selectedIndex = 0;
  }
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    status.textContent = "Your browser does not support speech synthesis.";
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  const selected = voices[Number(voiceSelect.value)];
  if (selected) {
    utterance.voice = selected;
    utterance.lang = selected.lang;
  } else {
    utterance.lang = "ar-MA";
  }
  utterance.rate = 0.92;
  utterance.onstart = () => status.textContent = "Speaking...";
  utterance.onend = () => status.textContent = "Ready";
  utterance.onerror = e => status.textContent =
    "Voice error: " + e.error + ". Try another installed voice.";
  speechSynthesis.speak(utterance);
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  const content = document.createElement("div");
  content.textContent = text;
  div.appendChild(content);

  if (who === "bot") {
    const button = document.createElement("button");
    button.textContent = "🔊 Listen";
    button.onclick = () => speak(text);
    div.appendChild(document.createElement("br"));
    div.appendChild(button);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function localReply(text) {
  const q = text.toLowerCase();

  if (/سلام|salam|السلام|مرحبا|marhba/.test(q))
    return "وعليكم السلام! مرحبا بيك 😊 كيداير؟ كيفاش نقدر نعاونك؟";

  if (/كيداير|لاباس|labas|كيف حالك/.test(q))
    return "الحمد لله، لاباس! نتمنى حتى نتا تكون بخير. آشنو خبارك؟";

  if (/سميتك|اسمك|شكون نتا|who are you/.test(q))
    return "أنا البوت ديالك، كنحاول نعاونك بالدارجة المغربية. شنو بغيتي تعرف؟";

  if (/شكرا|chokran|merci/.test(q))
    return "بالصحة والراحة! 😊 إلا احتجتي شي حاجة أخرى، أنا هنا.";

  if (/الطقس|الجو|weather/.test(q))
    return "باش نعطيك معلومات صحيحة على الطقس، خاصني نكون مربوط بخدمة ديال الطقس. شنو المدينة ديالك؟";

  if (/انجليزي|الإنجليزية|english/.test(q))
    return "مرحبا! نقدر نعاونك تتعلم الإنجليزية. مثلا: Hello معناها سلام، وHow are you? معناها كيداير؟";

  if (/نصيحة|advice/.test(q))
    return "نصيحة ليك: تعلم كل نهار شي حاجة جديدة، وخدم على أهدافك بشوية بشوية. الاستمرار أهم من السرعة!";

  return "فهمت عليك شوية، ولكن هادي نسخة تجريبية ومازال ما مربوطاش بذكاء اصطناعي. باش نجاوبك على أي سؤال بالدارجة، خاصنا نربطوها بموديل AI عبر backend.";
}

async function getReply(text) {
  // Connect your own backend here.
  // Example: POST /api/chat with { message: text, language: "ary" }
  // The backend should return JSON: { "reply": "..." }
  const endpoint = ""; // e.g. "/api/chat"

  if (endpoint) {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        language: "Moroccan Darija",
        script: $("script").value
      })
    });
    if (!response.ok) throw new Error("AI server returned " + response.status);
    const data = await response.json();
    if (!data.reply) throw new Error("The server did not return a reply.");
    return data.reply;
  }

  return localReply(text);
}

async function sendMessage(text) {
  text = (text || input.value).trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  $("send").disabled = true;
  status.textContent = "Preparing reply...";

  try {
    const reply = await getReply(text);
    addMessage(reply, "bot");
    status.textContent = "Ready";
  } catch (err) {
    addMessage("وقع مشكل فالاتصال. تأكد من خدمة AI ديالك وحاول مرة أخرى.", "bot");
    status.textContent = err.message;
  } finally {
    $("send").disabled = false;
    input.focus();
  }
}

$("send").addEventListener("click", () => sendMessage());
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.querySelectorAll("[data-msg]").forEach(button => {
  button.addEventListener("click", () => sendMessage(button.dataset.msg));
});

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "ar-MA";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;
    $("mic").textContent = "🔴 Listening...";
    status.textContent = "Speak now...";
  };

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    status.textContent = "Speech recognized. Sending...";
    sendMessage();
  };

  recognition.onerror = event => {
    status.textContent = "Microphone error: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    $("mic").textContent = "🎙️ Speak";
  };

  $("mic").addEventListener("click", () => {
    if (listening) recognition.stop();
    else {
      recognition.lang = /^ar|ary/i.test(voiceSelect.selectedOptions[0]?.text || "")
        ? "ar-MA" : "ar-MA";
      recognition.start();
    }
  });
} else {
  $("mic").addEventListener("click", () => {
    status.textContent =
      "Voice input is not supported here. Try Chrome or Edge, or type your message.";
  });
}
</script>
</body>
</html>
